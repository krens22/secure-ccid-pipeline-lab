name: Security Guard Automation
on: [push, pull_request]

jobs:
  secrets-scan:
    name: Scan Code for Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install TruffleHog CLI
        run: |
          curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

      - name: Run Deep Directory Scan
        run: |
          trufflehog filesystem . --fail
