name: Security Guard Automation
on: [push, pull_request]

jobs:
  secrets-scan:
    name: Scan Code for Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secrets Scanner
        uses: trufflesecurity/trufflehog-actions@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
